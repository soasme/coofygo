<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World – coofygo</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #87ceeb; }
    canvas { display: block; }
    #loading {
      position: fixed;
      inset: 0;
      background: #1a2a3a;
      color: #87ceeb;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      letter-spacing: 0.1em;
      z-index: 10;
      transition: opacity 0.6s;
    }
  </style>
</head>
<body>
  <div id="loading">Loading forest…</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ── Parse ?level= query param ───────────────
   Format: ?level=5-l,10-r
   Each token: <seconds>-<l|r>
   → { time: number, side: -1 | 1 }
──────────────────────────────────────────── */
function parseLevelParam() {
  const raw = new URLSearchParams(location.search).get('level') || '';
  return raw.split(',').flatMap(token => {
    const m = token.trim().match(/^(\d+(?:\.\d+)?)-([lr])$/i);
    if (!m) return [];
    return [{ time: parseFloat(m[1]), side: m[2].toLowerCase() === 'l' ? -1 : 1 }];
  }).sort((a, b) => a.time - b.time);
}
const schedule = parseLevelParam();

/* ── Renderer ────────────────────────────── */
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

/* ── Scene / Camera ──────────────────────── */
const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.FogExp2(0x90c8d8, 0.035);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 120);
camera.position.set(0, 1.6, 0);

/* ── Lights ──────────────────────────────── */
const sun = new THREE.DirectionalLight(0xfffbe8, 1.4);
sun.position.set(30, 60, -20);
sun.castShadow = true;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xb0d8f0, 0.8));

/* ── Texture loader with Promise wrapper ──── */
const texLoader = new THREE.TextureLoader();
const pendingTextures = [];   // track all texture loads for GPU pre-upload

function loadTex(path, repeat = [12, 600]) {
  const p = new Promise((res, rej) => texLoader.load(path, res, undefined, rej));
  pendingTextures.push(p);
  const t = texLoader.load(path);   // second load hits browser cache instantly
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(...repeat);
  return t;
}
const GROUND_BASE = '../../models/textures/ground/';
const groundColorTex  = loadTex(GROUND_BASE + 'Grass001_1K_Color.jpg');
const groundRoughTex  = loadTex(GROUND_BASE + 'Grass001_1K_Roughness.jpg');
const groundNormalTex = loadTex(GROUND_BASE + 'Grass001_1K_Normal.jpg');

const groundGeo = new THREE.PlaneGeometry(200, 10000, 1, 1);
const groundMat = new THREE.MeshStandardMaterial({
  map:         groundColorTex,
  roughnessMap:groundRoughTex,
  normalMap:   groundNormalTex,
  normalScale: new THREE.Vector2(1.2, 1.2),
  roughness:   1.0,
  metalness:   0.0,
});
const ground    = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ── Path ────────────────────────────────── */
const PATH_W = 512, PATH_H = 512;
const pathCanvas = document.createElement('canvas');
pathCanvas.width  = PATH_W;
pathCanvas.height = PATH_H;
const ctx = pathCanvas.getContext('2d');

ctx.fillStyle = '#c8b080';
ctx.fillRect(0, 0, PATH_W, PATH_H);

for (let i = 0; i < 18000; i++) {
  const x = Math.random() * PATH_W;
  const y = Math.random() * PATH_H;
  const r = Math.random() * 2.5;
  const v = Math.floor(130 + Math.random() * 60);
  ctx.fillStyle = `rgba(${v},${Math.floor(v*0.78)},${Math.floor(v*0.5)},0.35)`;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}

const trackColor = 'rgba(90,65,35,0.55)';
ctx.fillStyle = trackColor;
ctx.fillRect(PATH_W * 0.18, 0, PATH_W * 0.14, PATH_H);
ctx.fillRect(PATH_W * 0.68, 0, PATH_W * 0.14, PATH_H);

ctx.fillStyle = 'rgba(220,200,150,0.25)';
ctx.fillRect(PATH_W * 0.42, 0, PATH_W * 0.16, PATH_H);

for (let i = 0; i < 120; i++) {
  const px = Math.random() * PATH_W;
  const py = Math.random() * PATH_H;
  const pr = 1.5 + Math.random() * 3.5;
  ctx.fillStyle = `rgba(100,85,65,${0.3 + Math.random() * 0.4})`;
  ctx.beginPath(); ctx.ellipse(px, py, pr, pr * 0.7, Math.random() * Math.PI, 0, Math.PI * 2); ctx.fill();
}

const pathTex = new THREE.CanvasTexture(pathCanvas);
pathTex.wrapS = THREE.RepeatWrapping;
pathTex.wrapT = THREE.RepeatWrapping;
pathTex.repeat.set(1, 3000);

const pathGeo = new THREE.PlaneGeometry(3.2, 10000, 1, 1);
const pathMat = new THREE.MeshStandardMaterial({ map: pathTex, roughness: 0.92, metalness: 0.0 });
const path    = new THREE.Mesh(pathGeo, pathMat);
path.rotation.x = -Math.PI / 2;
path.position.y  = 0.012;
path.receiveShadow = true;
scene.add(path);

/* ── Clouds ──────────────────────────────── */
function makeCloud(x, y, z) {
  const g   = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const blobs = [
    [0, 0, 0, 2.5, 1.2, 2],
    [-2, -0.2, 0, 2, 1, 1.8],
    [ 2, -0.3, 0, 2, 1, 1.8],
    [0.8, 0.5, 0, 1.5, 0.8, 1.5],
  ];
  for (const [px, py, pz, sx, sy, sz] of blobs) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz, 2, 2, 2), mat);
    mesh.position.set(px, py, pz);
    g.add(mesh);
  }
  g.position.set(x, y, z);
  return g;
}

const clouds = [];
for (let i = 0; i < 40; i++) {
  const c = makeCloud(
    (Math.random() - 0.5) * 120,
    12 + Math.random() * 10,
    -400 + i * 50 + Math.random() * 30
  );
  scene.add(c);
  clouds.push(c);
}

/* ── Load GLB tree models ────────────────── */
const TREE_MODELS_BASE = '../../models/trees/';
const MODEL_FILES = [
  'tree_default.glb',
  'tree_oak.glb',
  'tree_cone.glb',
];

const loader = new GLTFLoader();
function loadGLB(url) {
  return new Promise((resolve, reject) => loader.load(url, resolve, undefined, reject));
}

async function main() {
  // Wait for all GLBs AND all textures to finish loading
  const [gltfs] = await Promise.all([
    Promise.all(MODEL_FILES.map(f => loadGLB(TREE_MODELS_BASE + f))),
    Promise.all(pendingTextures),
  ]);

  const prototypes = gltfs.map(g => {
    const root = g.scene;
    root.traverse(n => {
      if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; }
    });
    const box = new THREE.Box3().setFromObject(root);
    const h   = box.max.y - box.min.y;
    root.scale.setScalar(4.0 / h);
    box.setFromObject(root);
    root.position.y -= box.min.y;
    return root;
  });

  /* ── Tree pool ───────────────────────────── */
  const TREE_SPACING = 5;
  const TREE_ROWS    = 60;
  const HALF_Z       = (TREE_ROWS * TREE_SPACING) / 2;
  const CYCLE        = TREE_ROWS * TREE_SPACING;
  const treePool     = [];

  function spawnTree(x, z, scaleBoost = 1) {
    const proto = prototypes[Math.floor(Math.random() * prototypes.length)];
    const inst  = proto.clone();
    inst.position.set(x, 0, z);
    inst.rotation.y = Math.random() * Math.PI * 2;
    inst.scale.multiplyScalar((0.85 + Math.random() * 0.4) * scaleBoost);
    scene.add(inst);
    return inst;
  }

  const COLUMNS = [
    { xMin: 2.2,  xMax: 5.5,  scale: 1.0  },
    { xMin: 5.5,  xMax: 10.0, scale: 1.15 },
    { xMin: 10.0, xMax: 17.0, scale: 1.3  },
    { xMin: 17.0, xMax: 27.0, scale: 1.5  },
    { xMin: 27.0, xMax: 40.0, scale: 1.7  },
  ];

  for (let i = 0; i < TREE_ROWS; i++) {
    const z = -HALF_Z + i * TREE_SPACING;
    for (const col of COLUMNS) {
      const jitter = (Math.random() - 0.5) * 3;
      const x = col.xMin + Math.random() * (col.xMax - col.xMin);
      treePool.push(spawnTree( x, z + jitter, col.scale));
      treePool.push(spawnTree(-x, z + jitter, col.scale));
    }
  }

  /* ── GPU warm-up: upload textures + compile all shaders ─────── */
  // Force texture upload for every texture now, while loading screen is up
  for (const tex of [groundColorTex, groundRoughTex, groundNormalTex, pathTex]) {
    renderer.initTexture(tex);
  }

  // Pre-warm ruby + particle shaders by adding hidden dummies, compiling, then removing
  const _warmRubyMat = new THREE.MeshPhysicalMaterial({
    color: 0xcc0022, emissive: 0x440008, roughness: 0.05, metalness: 0.0,
    transmission: 0.5, thickness: 0.5, clearcoat: 1.0, clearcoatRoughness: 0.05,
  });
  const _warmRuby = new THREE.Mesh(new THREE.OctahedronGeometry(0.28, 0), _warmRubyMat);
  _warmRuby.position.set(0, -1000, 0);   // far below, never visible
  scene.add(_warmRuby);

  const _warmPtGeo = new THREE.BufferGeometry();
  _warmPtGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(3), 3));
  _warmPtGeo.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(3), 3));
  const _warmPtMat = new THREE.PointsMaterial({ size: 0.18, transparent: true, vertexColors: true });
  const _warmPts   = new THREE.Points(_warmPtGeo, _warmPtMat);
  _warmPts.position.set(0, -1000, 0);
  scene.add(_warmPts);

  // This call compiles every shader variant in the scene synchronously
  renderer.compile(scene, camera);

  // Clean up dummies
  scene.remove(_warmRuby);
  _warmRubyMat.dispose();
  scene.remove(_warmPts);
  _warmPtGeo.dispose();
  _warmPtMat.dispose();

  /* ── Hide loading screen ─────────────────── */
  const loadDiv = document.getElementById('loading');
  loadDiv.style.opacity = '0';
  setTimeout(() => loadDiv.remove(), 700);

  /* ── Ruby gems ───────────────────────────── */
  const rubyMat = new THREE.MeshPhysicalMaterial({
    color:        0xcc0022,
    emissive:     0x440008,
    roughness:    0.05,
    metalness:    0.0,
    transmission: 0.5,
    thickness:    0.5,
    reflectivity: 1.0,
    clearcoat:    1.0,
    clearcoatRoughness: 0.05,
  });
  const rubyGeo = new THREE.OctahedronGeometry(0.28, 0);
  const rubies  = [];  // { mesh, alive, autoSplash }

  // Spawn a ruby at the given side, 18 units ahead of camera
  function spawnRuby(side) {
    const x   = side * (1.8 + Math.random() * 0.4);
    const z   = camZ - 18;
    const gem = new THREE.Mesh(rubyGeo, rubyMat);
    gem.position.set(x, 0.3, z);
    gem.rotation.set(Math.random(), Math.random(), Math.random());
    scene.add(gem);
    rubies.push({ mesh: gem, alive: true, autoSplash: true });
  }

  /* ── Particle splashes ───────────────────── */
  const RUBY_PALETTE = [
    [1.0, 0.05, 0.15], [1.0, 0.2,  0.3 ], [0.9, 0.0,  0.05],
    [1.0, 0.55, 0.1 ], [1.0, 0.85, 0.2 ], [1.0, 1.0,  1.0 ],
    [0.7, 0.0,  0.2 ], [1.0, 0.3,  0.5 ],
  ];

  const activeSplashes = [];
  const PARTICLE_COUNT = 300;
  const P_DURATION     = 2.0;

  function doSplash(ruby) {
    if (!ruby.alive) return;
    const origin = ruby.mesh.position.clone();
    scene.remove(ruby.mesh);
    ruby.alive = false;

    const pPos = new Float32Array(PARTICLE_COUNT * 3);
    const pCol = new Float32Array(PARTICLE_COUNT * 3);
    const pVel = Array.from({ length: PARTICLE_COUNT }, () => new THREE.Vector3());

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      pPos[i * 3]     = origin.x;
      pPos[i * 3 + 1] = origin.y;
      pPos[i * 3 + 2] = origin.z;
      const fast  = Math.random() < 0.3;
      const speed = fast ? 10 + Math.random() * 8 : 3 + Math.random() * 6;
      const theta = Math.random() * Math.PI * 2;
      const phi   = Math.random() * Math.PI;
      pVel[i].set(
        Math.sin(phi) * Math.cos(theta) * speed,
        Math.abs(Math.cos(phi)) * speed * 1.2 + Math.random() * 3,
        Math.sin(phi) * Math.sin(theta) * speed
      );
      const col = RUBY_PALETTE[Math.floor(Math.random() * RUBY_PALETTE.length)];
      pCol[i * 3] = col[0]; pCol[i * 3 + 1] = col[1]; pCol[i * 3 + 2] = col[2];
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    geo.setAttribute('color',    new THREE.BufferAttribute(pCol, 3));
    const mat = new THREE.PointsMaterial({
      size: 0.18, sizeAttenuation: true,
      transparent: true, opacity: 1.0,
      depthWrite: false, vertexColors: true,
    });
    const pts = new THREE.Points(geo, mat);
    scene.add(pts);
    activeSplashes.push({ points: pts, mat, geo, pPos, pVel, life: P_DURATION });
  }

  /* ── Animation loop ──────────────────────── */
  const SPEED   = 5;
  const clock   = new THREE.Clock();
  let   camZ    = 0;
  let   elapsed = 0;
  let   nextIdx = 0;   // next schedule entry to process

  // Auto-move: camera always travels forward (−z)
  function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    elapsed += dt;

    // Always move forward
    camZ -= SPEED * dt;
    camera.position.z = camZ;

    // Fire scheduled ruby spawns
    while (nextIdx < schedule.length && elapsed >= schedule[nextIdx].time) {
      spawnRuby(schedule[nextIdx].side);
      nextIdx++;
    }

    // Spin rubies; auto-splash when camera reaches them
    const SPLASH_DIST = 2.5;  // units ahead of camera when auto-splash triggers
    for (const r of rubies) {
      if (!r.alive) continue;
      r.mesh.rotation.y += dt * 1.8;
      r.mesh.rotation.x += dt * 0.6;
      r.mesh.position.y = 0.3 + Math.sin(Date.now() * 0.002 + r.mesh.position.x) * 0.12;

      // Auto-splash: ruby's z is now at or behind the camera
      if (r.autoSplash && r.mesh.position.z >= camZ - SPLASH_DIST) {
        doSplash(r);
      }
    }

    // Animate active splashes
    for (let s = activeSplashes.length - 1; s >= 0; s--) {
      const sp = activeSplashes[s];
      sp.life -= dt;
      const t = 1 - sp.life / P_DURATION;
      sp.mat.opacity = Math.max(0, 1 - t * t * 1.5);
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        sp.pPos[i * 3]     += sp.pVel[i].x * dt;
        sp.pPos[i * 3 + 1] += (sp.pVel[i].y - 9.8 * t * 1.2) * dt;
        sp.pPos[i * 3 + 2] += sp.pVel[i].z * dt;
      }
      sp.geo.attributes.position.needsUpdate = true;
      if (sp.life <= 0) {
        scene.remove(sp.points);
        sp.geo.dispose();
        sp.mat.dispose();
        activeSplashes.splice(s, 1);
      }
    }

    // Wrap tree pool
    for (const tree of treePool) {
      const rel = tree.position.z - camZ;
      if (rel > CYCLE / 2)  tree.position.z -= CYCLE;
      if (rel < -CYCLE / 2) tree.position.z += CYCLE;
    }

    // Drift clouds
    for (const cloud of clouds) {
      cloud.position.x += 0.5 * dt;
      if (cloud.position.x > 60) cloud.position.x = -60;
      const relZ = cloud.position.z - camZ;
      if (relZ > 1000)  cloud.position.z -= 2000;
      if (relZ < -1000) cloud.position.z += 2000;
    }

    renderer.render(scene, camera);
  }

  animate();
}

main().catch(console.error);

/* ── Resize ──────────────────────────────── */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
  </script>
</body>
</html>
