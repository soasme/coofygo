<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World – coofygo</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #87ceeb; }
    canvas { display: block; }
    #loading {
      position: fixed;
      inset: 0;
      background: #1a2a3a;
      color: #87ceeb;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      letter-spacing: 0.1em;
      z-index: 10;
      transition: opacity 0.6s;
    }
  </style>
</head>
<body>
  <div id="loading">Loading forest…</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ── Query params ────────────────────────────────────────────────────────────
   level      ?level=5-l,10-r        Ruby schedule: <sec>-<l|r>, comma-sep
   grass      ?grass=0               Set to 0 to disable grass splats
   gCount     ?gCount=6              Gaussian splats per tree (default 6)
   gSize      ?gSize=1.0             World-space size of each splat (default 1.0)
   gOpacity   ?gOpacity=0.82         Splat opacity 0–1 (default 0.82)
   gColor     ?gColor=3d8b2f         Base grass color, hex without # (default 3d8b2f)
   gSpread    ?gSpread=0.8           Scatter radius around tree base (default 0.8)
   gDensity   ?gDensity=8            Gaussian blobs drawn per splat texture (default 8)
──────────────────────────────────────────────────────────────────────────── */
const QP = new URLSearchParams(location.search);

function parseLevelParam() {
  const raw = QP.get('level') || '';
  return raw.split(',').flatMap(token => {
    const m = token.trim().match(/^(\d+(?:\.\d+)?)-([lr])$/i);
    if (!m) return [];
    return [{ time: parseFloat(m[1]), side: m[2].toLowerCase() === 'l' ? -1 : 1 }];
  }).sort((a, b) => a.time - b.time);
}
const schedule = parseLevelParam();

const grassCfg = {
  enabled : QP.get('grass')    !== '0',
  count   : Math.max(1, parseInt(QP.get('gCount')   || '6')),
  size    : parseFloat(QP.get('gSize')    || '1.0'),
  opacity : parseFloat(QP.get('gOpacity') || '0.82'),
  color   : '#' + (QP.get('gColor')   || '3d8b2f'),
  spread  : parseFloat(QP.get('gSpread')  || '0.8'),
  density : Math.max(1, parseInt(QP.get('gDensity') || '8')),
};

/* ── Renderer ────────────────────────────── */
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

/* ── Scene / Camera ──────────────────────── */
const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.FogExp2(0x90c8d8, 0.035);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 120);
camera.position.set(0, 1.6, 0);

/* ── Lights ──────────────────────────────── */
const sun = new THREE.DirectionalLight(0xfffbe8, 1.4);
sun.position.set(30, 60, -20);
sun.castShadow = true;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xb0d8f0, 0.8));

/* ── Texture loader with Promise wrapper ──── */
const texLoader      = new THREE.TextureLoader();
const pendingTextures = [];

function loadTex(path, repeat = [12, 600]) {
  const p = new Promise((res, rej) => texLoader.load(path, res, undefined, rej));
  pendingTextures.push(p);
  const t = texLoader.load(path);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(...repeat);
  return t;
}

const GROUND_BASE     = '../../models/textures/ground/';
const groundColorTex  = loadTex(GROUND_BASE + 'Grass001_1K_Color.jpg');
const groundRoughTex  = loadTex(GROUND_BASE + 'Grass001_1K_Roughness.jpg');
const groundNormalTex = loadTex(GROUND_BASE + 'Grass001_1K_Normal.jpg');

const groundGeo = new THREE.PlaneGeometry(200, 10000, 1, 1);
const groundMat = new THREE.MeshStandardMaterial({
  map:         groundColorTex,
  roughnessMap:groundRoughTex,
  normalMap:   groundNormalTex,
  normalScale: new THREE.Vector2(1.2, 1.2),
  roughness:   1.0,
  metalness:   0.0,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ── Path ────────────────────────────────── */
const PATH_W = 512, PATH_H = 512;
const pathCanvas = document.createElement('canvas');
pathCanvas.width  = PATH_W;
pathCanvas.height = PATH_H;
const ctx = pathCanvas.getContext('2d');
ctx.fillStyle = '#c8b080';
ctx.fillRect(0, 0, PATH_W, PATH_H);
for (let i = 0; i < 18000; i++) {
  const x = Math.random() * PATH_W, y = Math.random() * PATH_H;
  const r = Math.random() * 2.5;
  const v = Math.floor(130 + Math.random() * 60);
  ctx.fillStyle = `rgba(${v},${Math.floor(v*0.78)},${Math.floor(v*0.5)},0.35)`;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
ctx.fillStyle = 'rgba(90,65,35,0.55)';
ctx.fillRect(PATH_W * 0.18, 0, PATH_W * 0.14, PATH_H);
ctx.fillRect(PATH_W * 0.68, 0, PATH_W * 0.14, PATH_H);
ctx.fillStyle = 'rgba(220,200,150,0.25)';
ctx.fillRect(PATH_W * 0.42, 0, PATH_W * 0.16, PATH_H);
for (let i = 0; i < 120; i++) {
  const px = Math.random() * PATH_W, py = Math.random() * PATH_H;
  const pr = 1.5 + Math.random() * 3.5;
  ctx.fillStyle = `rgba(100,85,65,${0.3 + Math.random() * 0.4})`;
  ctx.beginPath(); ctx.ellipse(px, py, pr, pr * 0.7, Math.random() * Math.PI, 0, Math.PI * 2); ctx.fill();
}
const pathTex = new THREE.CanvasTexture(pathCanvas);
pathTex.wrapS = pathTex.wrapT = THREE.RepeatWrapping;
pathTex.repeat.set(1, 3000);
const pathGeo = new THREE.PlaneGeometry(3.2, 10000, 1, 1);
const pathMat = new THREE.MeshStandardMaterial({ map: pathTex, roughness: 0.92, metalness: 0.0 });
const pathMesh = new THREE.Mesh(pathGeo, pathMat);
pathMesh.rotation.x = -Math.PI / 2;
pathMesh.position.y  = 0.012;
pathMesh.receiveShadow = true;
scene.add(pathMesh);

/* ── Clouds ──────────────────────────────── */
function makeCloud(x, y, z) {
  const g   = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  for (const [px, py, pz, sx, sy, sz] of [
    [0, 0, 0, 2.5, 1.2, 2], [-2, -0.2, 0, 2, 1, 1.8],
    [ 2, -0.3, 0, 2, 1, 1.8], [0.8, 0.5, 0, 1.5, 0.8, 1.5],
  ]) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz, 2, 2, 2), mat);
    m.position.set(px, py, pz);
    g.add(m);
  }
  g.position.set(x, y, z);
  return g;
}
const clouds = [];
for (let i = 0; i < 40; i++) {
  const c = makeCloud(
    (Math.random() - 0.5) * 120,
    12 + Math.random() * 10,
    -400 + i * 50 + Math.random() * 30
  );
  scene.add(c);
  clouds.push(c);
}

/* ── GLB loader ──────────────────────────── */
const TREE_MODELS_BASE = '../../models/trees/';
const MODEL_FILES = ['tree_default.glb', 'tree_oak.glb', 'tree_cone.glb'];
const loader = new GLTFLoader();
function loadGLB(url) {
  return new Promise((resolve, reject) => loader.load(url, resolve, undefined, reject));
}

/* ── Gaussian splat grass texture (procedural) ───────────────────────────
   Draws `density` soft overlapping gaussian ellipses in green tones.
   Returns a CanvasTexture.
──────────────────────────────────────────────────────────────────────── */
function makeGrassSplatTexture(colorHex, density) {
  const SIZE = 128;
  const c    = document.createElement('canvas');
  c.width = c.height = SIZE;
  const cx   = c.getContext('2d');
  const base = new THREE.Color(colorHex);
  const ri   = Math.round(base.r * 255);
  const gi   = Math.round(base.g * 255);
  const bi   = Math.round(base.b * 255);

  for (let k = 0; k < density; k++) {
    // Random position biased toward centre
    const bx = SIZE * 0.5 + (Math.random() - 0.5) * SIZE * 0.55;
    const by = SIZE * 0.55 + (Math.random() - 0.5) * SIZE * 0.45;
    const rx = 12 + Math.random() * 28;   // horizontal radius
    const ry = rx * (1.1 + Math.random() * 0.7); // slightly taller (blade-like)
    const angle = (Math.random() - 0.5) * 0.5;

    // Highlight (brighter inner)
    const rh = Math.min(255, ri + 35 + Math.floor(Math.random() * 20));
    const gh = Math.min(255, gi + 50 + Math.floor(Math.random() * 20));
    const bh = Math.min(255, bi + 10);

    const grad = cx.createRadialGradient(bx, by, 0, bx, by, Math.max(rx, ry));
    grad.addColorStop(0,    `rgba(${rh},${gh},${bh},0.92)`);
    grad.addColorStop(0.35, `rgba(${ri},${gi},${bi},0.72)`);
    grad.addColorStop(0.7,  `rgba(${Math.max(0,ri-20)},${Math.max(0,gi-30)},${Math.max(0,bi-5)},0.3)`);
    grad.addColorStop(1,    `rgba(${Math.max(0,ri-30)},${Math.max(0,gi-40)},${Math.max(0,bi-10)},0)`);

    cx.save();
    cx.translate(bx, by);
    cx.rotate(angle);
    cx.scale(1, ry / rx);
    cx.beginPath();
    cx.arc(0, 0, rx, 0, Math.PI * 2);
    cx.fillStyle = grad;
    cx.fill();
    cx.restore();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.premultiplyAlpha = false;
  return tex;
}

/* ── Grass billboard shader ──────────────────────────────────────────────
   Each instance is a quad (PlaneGeometry 1×1) billboarded toward the camera
   in view space.  aOffset = world-space center, aSize = world-space width.
   Fog matches scene.fog (FogExp2 density 0.035).
──────────────────────────────────────────────────────────────────────── */
const GRASS_VERT = /* glsl */`
  attribute vec3  aOffset;
  attribute float aSize;

  varying vec2  vUv;
  varying float vFogDepth;

  void main() {
    vUv = uv;
    // Camera-space centre of this splat
    vec4 mvCenter = modelViewMatrix * vec4(aOffset, 1.0);
    // Billboard: shift quad vertices in camera XY (ignores rotation)
    mvCenter.xy += position.xy * aSize;
    vFogDepth    = -mvCenter.z;          // positive view-space depth
    gl_Position  = projectionMatrix * mvCenter;
  }
`;

const GRASS_FRAG = /* glsl */`
  uniform sampler2D uMap;
  uniform float     uOpacity;
  uniform vec3      uFogColor;
  uniform float     uFogDensity;

  varying vec2  vUv;
  varying float vFogDepth;

  void main() {
    vec4 col = texture2D(uMap, vUv);
    if (col.a < 0.04) discard;

    // FogExp2
    float fogFactor = 1.0 - exp(-uFogDensity * vFogDepth);
    fogFactor = clamp(fogFactor, 0.0, 1.0);

    col.rgb  = mix(col.rgb, uFogColor, fogFactor);
    col.a   *= uOpacity * (1.0 - fogFactor * 0.6);

    gl_FragColor = col;
  }
`;

async function main() {
  /* ── Load all assets ─────────────────────── */
  const [gltfs] = await Promise.all([
    Promise.all(MODEL_FILES.map(f => loadGLB(TREE_MODELS_BASE + f))),
    Promise.all(pendingTextures),
  ]);

  const prototypes = gltfs.map(g => {
    const root = g.scene;
    root.traverse(n => {
      if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; }
    });
    const box = new THREE.Box3().setFromObject(root);
    root.scale.setScalar(4.0 / (box.max.y - box.min.y));
    box.setFromObject(root);
    root.position.y -= box.min.y;
    return root;
  });

  /* ── Tree pool ───────────────────────────── */
  const TREE_SPACING = 5;
  const TREE_ROWS    = 60;
  const HALF_Z       = (TREE_ROWS * TREE_SPACING) / 2;
  const CYCLE        = TREE_ROWS * TREE_SPACING;
  const treePool     = [];

  function spawnTree(x, z, scaleBoost = 1) {
    const proto = prototypes[Math.floor(Math.random() * prototypes.length)];
    const inst  = proto.clone();
    inst.position.set(x, 0, z);
    inst.rotation.y = Math.random() * Math.PI * 2;
    inst.scale.multiplyScalar((0.85 + Math.random() * 0.4) * scaleBoost);
    scene.add(inst);
    return inst;
  }

  const COLUMNS = [
    { xMin: 2.2,  xMax: 5.5,  scale: 1.0  },
    { xMin: 5.5,  xMax: 10.0, scale: 1.15 },
    { xMin: 10.0, xMax: 17.0, scale: 1.3  },
    { xMin: 17.0, xMax: 27.0, scale: 1.5  },
    { xMin: 27.0, xMax: 40.0, scale: 1.7  },
  ];

  for (let i = 0; i < TREE_ROWS; i++) {
    const z = -HALF_Z + i * TREE_SPACING;
    for (const col of COLUMNS) {
      const jitter = (Math.random() - 0.5) * 3;
      const x = col.xMin + Math.random() * (col.xMax - col.xMin);
      treePool.push(spawnTree( x, z + jitter, col.scale));
      treePool.push(spawnTree(-x, z + jitter, col.scale));
    }
  }

  /* ── Gaussian splat grass system ─────────────────────────────────────
     Single InstancedBufferGeometry + custom billboard shader.
     One draw call for all splats.  Positions updated each frame as
     trees wrap, so splats always follow their parent tree.
  ─────────────────────────────────────────────────────────────────── */
  let grassMesh      = null;
  let grassWorldPos  = null;   // Float32Array, updated each frame
  let grassTreeIdx   = null;   // which treePool[] index owns this splat
  let grassLocalOff  = null;   // local XZ offset relative to tree base
  let grassInstGeo   = null;

  if (grassCfg.enabled) {
    const totalSplats = treePool.length * grassCfg.count;

    grassWorldPos = new Float32Array(totalSplats * 3);
    grassTreeIdx  = new Int32Array(totalSplats);
    grassLocalOff = new Float32Array(totalSplats * 3);  // x,y=0,z per splat
    const splatSizes = new Float32Array(totalSplats);

    for (let t = 0; t < treePool.length; t++) {
      const tree = treePool[t];
      for (let g = 0; g < grassCfg.count; g++) {
        const i     = t * grassCfg.count + g;
        const angle = Math.random() * Math.PI * 2;
        const r     = grassCfg.spread * Math.sqrt(Math.random()); // uniform disk
        grassLocalOff[i * 3]     = Math.cos(angle) * r;
        grassLocalOff[i * 3 + 1] = 0.02;           // just above ground
        grassLocalOff[i * 3 + 2] = Math.sin(angle) * r;
        grassTreeIdx[i]           = t;
        splatSizes[i]             = grassCfg.size * (0.65 + Math.random() * 0.7);

        // Initial world position
        grassWorldPos[i * 3]     = tree.position.x + grassLocalOff[i * 3];
        grassWorldPos[i * 3 + 1] = grassLocalOff[i * 3 + 1];
        grassWorldPos[i * 3 + 2] = tree.position.z + grassLocalOff[i * 3 + 2];
      }
    }

    // Build InstancedBufferGeometry from a unit PlaneGeometry
    const basePlane = new THREE.PlaneGeometry(1, 1);
    grassInstGeo = new THREE.InstancedBufferGeometry();
    grassInstGeo.index              = basePlane.index;
    grassInstGeo.attributes.position = basePlane.attributes.position;
    grassInstGeo.attributes.uv       = basePlane.attributes.uv;
    grassInstGeo.setAttribute('aOffset', new THREE.InstancedBufferAttribute(grassWorldPos, 3, false));
    grassInstGeo.setAttribute('aSize',   new THREE.InstancedBufferAttribute(splatSizes,   1, false));
    grassInstGeo.instanceCount = totalSplats;

    const grassTex = makeGrassSplatTexture(grassCfg.color, grassCfg.density);
    renderer.initTexture(grassTex);

    const fogColor = new THREE.Color(0x90c8d8);
    const grassMat = new THREE.ShaderMaterial({
      vertexShader  : GRASS_VERT,
      fragmentShader: GRASS_FRAG,
      uniforms: {
        uMap       : { value: grassTex },
        uOpacity   : { value: grassCfg.opacity },
        uFogColor  : { value: fogColor },
        uFogDensity: { value: 0.035 },
      },
      transparent   : true,
      depthWrite    : false,
      side          : THREE.DoubleSide,
    });

    grassMesh = new THREE.Mesh(grassInstGeo, grassMat);
    grassMesh.frustumCulled = false;   // pool wraps globally, must always render
    grassMesh.renderOrder   = 1;       // after opaque geometry
    scene.add(grassMesh);
  }

  /* ── GPU warm-up ─────────────────────────── */
  for (const tex of [groundColorTex, groundRoughTex, groundNormalTex, pathTex]) {
    renderer.initTexture(tex);
  }

  // Dummy ruby + particle materials so their shaders are pre-compiled
  const _wRM  = new THREE.MeshPhysicalMaterial({
    color: 0xcc0022, emissive: 0x440008, roughness: 0.05, metalness: 0.0,
    transmission: 0.5, thickness: 0.5, clearcoat: 1.0, clearcoatRoughness: 0.05,
  });
  const _wR   = new THREE.Mesh(new THREE.OctahedronGeometry(0.28, 0), _wRM);
  _wR.position.set(0, -1000, 0);
  scene.add(_wR);

  const _wPG  = new THREE.BufferGeometry();
  _wPG.setAttribute('position', new THREE.BufferAttribute(new Float32Array(3), 3));
  _wPG.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(3), 3));
  const _wPM  = new THREE.PointsMaterial({ size: 0.18, transparent: true, vertexColors: true });
  const _wP   = new THREE.Points(_wPG, _wPM);
  _wP.position.set(0, -1000, 0);
  scene.add(_wP);

  renderer.compile(scene, camera);

  scene.remove(_wR);  _wRM.dispose();
  scene.remove(_wP);  _wPG.dispose(); _wPM.dispose();

  /* ── Hide loading screen ─────────────────── */
  const loadDiv = document.getElementById('loading');
  loadDiv.style.opacity = '0';
  setTimeout(() => loadDiv.remove(), 700);

  /* ── Ruby gems ───────────────────────────── */
  const rubyMat = new THREE.MeshPhysicalMaterial({
    color: 0xcc0022, emissive: 0x440008, roughness: 0.05, metalness: 0.0,
    transmission: 0.5, thickness: 0.5, reflectivity: 1.0,
    clearcoat: 1.0, clearcoatRoughness: 0.05,
  });
  const rubyGeo = new THREE.OctahedronGeometry(0.28, 0);
  const rubies  = [];

  function spawnRuby(side) {
    const x   = side * (1.8 + Math.random() * 0.4);
    const gem = new THREE.Mesh(rubyGeo, rubyMat);
    gem.position.set(x, 0.3, camZ - 18);
    gem.rotation.set(Math.random(), Math.random(), Math.random());
    scene.add(gem);
    rubies.push({ mesh: gem, alive: true });
  }

  /* ── Particle splashes ───────────────────── */
  const RUBY_PALETTE = [
    [1.0,0.05,0.15],[1.0,0.2,0.3],[0.9,0.0,0.05],
    [1.0,0.55,0.1],[1.0,0.85,0.2],[1.0,1.0,1.0],
    [0.7,0.0,0.2],[1.0,0.3,0.5],
  ];
  const activeSplashes = [];
  const PARTICLE_COUNT = 300;
  const P_DURATION     = 2.0;

  function doSplash(ruby) {
    if (!ruby.alive) return;
    const origin = ruby.mesh.position.clone();
    scene.remove(ruby.mesh);
    ruby.alive = false;

    const pPos = new Float32Array(PARTICLE_COUNT * 3);
    const pCol = new Float32Array(PARTICLE_COUNT * 3);
    const pVel = Array.from({ length: PARTICLE_COUNT }, () => new THREE.Vector3());

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      pPos[i*3] = origin.x; pPos[i*3+1] = origin.y; pPos[i*3+2] = origin.z;
      const speed = Math.random() < 0.3 ? 10 + Math.random() * 8 : 3 + Math.random() * 6;
      const theta = Math.random() * Math.PI * 2, phi = Math.random() * Math.PI;
      pVel[i].set(
        Math.sin(phi) * Math.cos(theta) * speed,
        Math.abs(Math.cos(phi)) * speed * 1.2 + Math.random() * 3,
        Math.sin(phi) * Math.sin(theta) * speed
      );
      const col = RUBY_PALETTE[Math.floor(Math.random() * RUBY_PALETTE.length)];
      pCol[i*3] = col[0]; pCol[i*3+1] = col[1]; pCol[i*3+2] = col[2];
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    geo.setAttribute('color',    new THREE.BufferAttribute(pCol, 3));
    const mat = new THREE.PointsMaterial({
      size: 0.18, sizeAttenuation: true,
      transparent: true, opacity: 1.0,
      depthWrite: false, vertexColors: true,
    });
    const pts = new THREE.Points(geo, mat);
    scene.add(pts);
    activeSplashes.push({ points: pts, mat, geo, pPos, pVel, life: P_DURATION });
  }

  /* ── Animation loop ──────────────────────── */
  const SPEED   = 5;
  const clock   = new THREE.Clock();
  let   camZ    = 0;
  let   elapsed = 0;
  let   nextIdx = 0;

  function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    elapsed += dt;

    camZ -= SPEED * dt;
    camera.position.z = camZ;

    // Scheduled ruby spawns
    while (nextIdx < schedule.length && elapsed >= schedule[nextIdx].time) {
      spawnRuby(schedule[nextIdx].side);
      nextIdx++;
    }

    // Rubies: spin + auto-splash on reach
    const SPLASH_DIST = 2.5;
    for (const r of rubies) {
      if (!r.alive) continue;
      r.mesh.rotation.y += dt * 1.8;
      r.mesh.rotation.x += dt * 0.6;
      r.mesh.position.y  = 0.3 + Math.sin(Date.now() * 0.002 + r.mesh.position.x) * 0.12;
      if (r.mesh.position.z >= camZ - SPLASH_DIST) doSplash(r);
    }

    // Active splashes
    for (let s = activeSplashes.length - 1; s >= 0; s--) {
      const sp = activeSplashes[s];
      sp.life -= dt;
      const t = 1 - sp.life / P_DURATION;
      sp.mat.opacity = Math.max(0, 1 - t * t * 1.5);
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        sp.pPos[i*3]   += sp.pVel[i].x * dt;
        sp.pPos[i*3+1] += (sp.pVel[i].y - 9.8 * t * 1.2) * dt;
        sp.pPos[i*3+2] += sp.pVel[i].z * dt;
      }
      sp.geo.attributes.position.needsUpdate = true;
      if (sp.life <= 0) {
        scene.remove(sp.points); sp.geo.dispose(); sp.mat.dispose();
        activeSplashes.splice(s, 1);
      }
    }

    // Wrap tree pool; update grass world positions in the same pass
    for (let ti = 0; ti < treePool.length; ti++) {
      const tree = treePool[ti];
      const rel  = tree.position.z - camZ;
      if (rel > CYCLE / 2)  tree.position.z -= CYCLE;
      if (rel < -CYCLE / 2) tree.position.z += CYCLE;
    }

    // Update grass splat world positions after tree wrapping
    if (grassCfg.enabled && grassInstGeo) {
      for (let i = 0; i < grassInstGeo.instanceCount; i++) {
        const tree = treePool[grassTreeIdx[i]];
        grassWorldPos[i*3]     = tree.position.x + grassLocalOff[i*3];
        grassWorldPos[i*3+1]   = grassLocalOff[i*3+1];
        grassWorldPos[i*3+2]   = tree.position.z + grassLocalOff[i*3+2];
      }
      grassInstGeo.attributes.aOffset.needsUpdate = true;
    }

    // Drift clouds
    for (const cloud of clouds) {
      cloud.position.x += 0.5 * dt;
      if (cloud.position.x > 60) cloud.position.x = -60;
      const relZ = cloud.position.z - camZ;
      if (relZ > 1000)  cloud.position.z -= 2000;
      if (relZ < -1000) cloud.position.z += 2000;
    }

    renderer.render(scene, camera);
  }

  animate();
}

main().catch(console.error);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
  </script>
</body>
</html>
