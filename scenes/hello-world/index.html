  <script type="importmap">

  <script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ── Query params ───────────────────────────────────────────────────────
   level       ?level=5-l,10-r     Ruby schedule: <sec>-<l|r>, comma-sep
   grass       ?grass=0            Set to 0 to disable grass
   gCount      ?gCount=80          Grass blades per tree (default 80)
   gHeight     ?gHeight=0.55       Blade height in world units (default 0.55)
   gWidth      ?gWidth=0.12        Blade base width in world units (default 0.12)
   gSpread     ?gSpread=1.0        Scatter radius around tree base (default 1.0)
   gBase       ?gBase=1a3d0a       Base (root) color hex, no # (default 1a3d0a)
   gTip        ?gTip=6fc93a        Tip color hex, no # (default 6fc93a)
   gWind       ?gWind=0.35         Wind bend strength (default 0.35)
   gWindSpeed  ?gWindSpeed=0.8     Wind animation speed (default 0.8)
──────────────────────────────────────────────────────────────────────── */
const QP = new URLSearchParams(location.search);

function parseLevelParam() {
  const raw = QP.get('level') || '';
  return raw.split(',').flatMap(token => {
    const m = token.trim().match(/^(\d+(?:\.\d+)?)-([lr])$/i);
    if (!m) return [];
    return [{ time: parseFloat(m[1]), side: m[2].toLowerCase() === 'l' ? -1 : 1 }];
  }).sort((a, b) => a.time - b.time);
}
const schedule = parseLevelParam();

const grassCfg = {
  enabled   : QP.get('grass')      !== '0',
  count     : Math.max(1, parseInt(QP.get('gCount')     ?? '80')),
  height    : parseFloat(QP.get('gHeight')    ?? '0.55'),
  width     : parseFloat(QP.get('gWidth')     ?? '0.12'),
  spread    : parseFloat(QP.get('gSpread')    ?? '1.0'),
  baseColor : '#' + (QP.get('gBase')          ?? '1a3d0a'),
  tipColor  : '#' + (QP.get('gTip')           ?? '6fc93a'),
  wind      : parseFloat(QP.get('gWind')      ?? '0.35'),
  windSpeed : parseFloat(QP.get('gWindSpeed') ?? '0.8'),
};

/* ── Renderer ────────────────────────────── */
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

/* ── Scene / Camera ──────────────────────── */
const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.FogExp2(0x90c8d8, 0.035);
const FOG_COLOR   = new THREE.Color(0x90c8d8);
const FOG_DENSITY = 0.035;

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 120);
camera.position.set(0, 1.6, 0);

/* ── Lights ──────────────────────────────── */
const sun = new THREE.DirectionalLight(0xfffbe8, 1.4);
sun.position.set(30, 60, -20);
sun.castShadow = true;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xb0d8f0, 0.8));

/* ── Texture loader ──────────────────────── */
const texLoader      = new THREE.TextureLoader();
const pendingTextures = [];
function loadTex(path, repeat = [12, 600]) {
  const p = new Promise((res, rej) => texLoader.load(path, res, undefined, rej));
  pendingTextures.push(p);
  const t = texLoader.load(path);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(...repeat);
  return t;
}

const GROUND_BASE     = '../../models/textures/ground/';
const groundColorTex  = loadTex(GROUND_BASE + 'Grass001_1K_Color.jpg');
const groundRoughTex  = loadTex(GROUND_BASE + 'Grass001_1K_Roughness.jpg');
const groundNormalTex = loadTex(GROUND_BASE + 'Grass001_1K_Normal.jpg');

const groundGeo = new THREE.PlaneGeometry(200, 10000, 1, 1);
const groundMat = new THREE.MeshStandardMaterial({
  map: groundColorTex, roughnessMap: groundRoughTex, normalMap: groundNormalTex,
  normalScale: new THREE.Vector2(1.2, 1.2), roughness: 1.0, metalness: 0.0,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ── Path ────────────────────────────────── */
const pathCanvas = document.createElement('canvas');
pathCanvas.width = pathCanvas.height = 512;
const ctx = pathCanvas.getContext('2d');
ctx.fillStyle = '#c8b080'; ctx.fillRect(0, 0, 512, 512);
for (let i = 0; i < 18000; i++) {
  const x = Math.random()*512, y = Math.random()*512, r = Math.random()*2.5;
  const v = Math.floor(130 + Math.random()*60);
  ctx.fillStyle = `rgba(${v},${Math.floor(v*.78)},${Math.floor(v*.5)},0.35)`;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
}
ctx.fillStyle = 'rgba(90,65,35,0.55)';
ctx.fillRect(512*.18, 0, 512*.14, 512); ctx.fillRect(512*.68, 0, 512*.14, 512);
ctx.fillStyle = 'rgba(220,200,150,0.25)'; ctx.fillRect(512*.42, 0, 512*.16, 512);
for (let i = 0; i < 120; i++) {
  const px = Math.random()*512, py = Math.random()*512, pr = 1.5 + Math.random()*3.5;
  ctx.fillStyle = `rgba(100,85,65,${0.3 + Math.random()*.4})`;
  ctx.beginPath(); ctx.ellipse(px, py, pr, pr*.7, Math.random()*Math.PI, 0, Math.PI*2); ctx.fill();
}
const pathTex = new THREE.CanvasTexture(pathCanvas);
pathTex.wrapS = pathTex.wrapT = THREE.RepeatWrapping; pathTex.repeat.set(1, 3000);
const pathMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(3.2, 10000),
  new THREE.MeshStandardMaterial({ map: pathTex, roughness: 0.92, metalness: 0.0 })
);
pathMesh.rotation.x = -Math.PI/2; pathMesh.position.y = 0.012;
pathMesh.receiveShadow = true; scene.add(pathMesh);

/* ── Clouds ──────────────────────────────── */
function makeCloud(x, y, z) {
  const g = new THREE.Group(), mat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  for (const [px,py,pz,sx,sy,sz] of [[0,0,0,2.5,1.2,2],[-2,-0.2,0,2,1,1.8],[2,-0.3,0,2,1,1.8],[0.8,0.5,0,1.5,.8,1.5]]) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz,2,2,2), mat);
    m.position.set(px,py,pz); g.add(m);
  }
  g.position.set(x,y,z); return g;
}
const clouds = [];
for (let i = 0; i < 40; i++) {
  const c = makeCloud((Math.random()-.5)*120, 12+Math.random()*10, -400+i*50+Math.random()*30);
  scene.add(c); clouds.push(c);
}

/* ── GLB loader ──────────────────────────── */
const TREE_MODELS_BASE = '../../models/trees/';
const loader = new GLTFLoader();
function loadGLB(url) {
  return new Promise((res, rej) => loader.load(url, res, undefined, rej));
}

/* ═══════════════════════════════════════════════════════════════════════
   GRASS SYSTEM — real blade geometry + wind shader
   Technique from green-grass-v3.vercel.app (MIT)
   ═══════════════════════════════════════════════════════════════════════ */

/* ── Blade texture: bezier leaf shape on canvas ── */
function makeBladeTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const cx = c.getContext('2d');
  cx.fillStyle = '#000'; cx.fillRect(0, 0, 128, 128);
  cx.beginPath();
  cx.moveTo(64, 128);
  cx.lineTo(0, 128);
  cx.bezierCurveTo(0, 50, 64, 0, 64, 0);
  cx.bezierCurveTo(64, 0, 128, 50, 128, 128);
  cx.lineTo(64, 128);
  cx.fillStyle = '#fff'; cx.fill();
  const t = new THREE.CanvasTexture(c);
  t.needsUpdate = true;
  return t;
}

/* ── Blade geometry: 3-column (L,center-depth,R) × 6 segments, tapered ── */
function createBladeGeometry(bladeWidth, bladeHeight) {
  const segs = 5;
  const positions = [], uvs = [], indices = [];
  for (let i = 0; i <= segs; i++) {
    const t  = i / segs;
    const w  = bladeWidth * (1 - t * 0.7);
    const d  = w * 0.3;
    positions.push(-w/2, bladeHeight*t, 0);  uvs.push(0,   t);
    positions.push(  0,  bladeHeight*t, d);  uvs.push(0.5, t);
    positions.push( w/2, bladeHeight*t, 0);  uvs.push(1,   t);
  }
  for (let i = 0; i < segs; i++) {
    const b = i*3, n = (i+1)*3;
    indices.push(b,b+1,n,  n,b+1,n+1,  b+1,b+2,n+1,  n+1,b+2,n+2);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv',       new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

/* ── Simplex noise (2D) GLSL snippet ── */
const SNOISE_GLSL = /* glsl */`
  vec3 _snoise_permute(vec3 x){ return mod(((x*34.0)+1.0)*x,289.0); }
  float snoise(vec2 v){
    const vec4 C=vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);
    vec2 i=floor(v+dot(v,C.yy));
    vec2 x0=v-i+dot(i,C.xx);
    vec2 i1=(x0.x>x0.y)?vec2(1.0,0.0):vec2(0.0,1.0);
    vec4 x12=x0.xyxy+C.xxzz; x12.xy-=i1;
    i=mod(i,289.0);
    vec3 p=_snoise_permute(_snoise_permute(i.y+vec3(0.0,i1.y,1.0))+i.x+vec3(0.0,i1.x,1.0));
    vec3 m=max(0.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.0);
    m=m*m; m=m*m;
    vec3 x=2.0*fract(p*C.www)-1.0;
    vec3 h=abs(x)-0.5;
    vec3 ox=floor(x+0.5);
    vec3 a0=x-ox;
    m*=1.79284291400159-0.85373472095314*(a0*a0+h*h);
    vec3 g;
    g.x=a0.x*x0.x+h.x*x0.y;
    g.yz=a0.yz*x12.xz+h.yz*x12.yw;
    return 130.0*dot(m,g);
  }
`;

const GRASS_VERT = /* glsl */`
  ${SNOISE_GLSL}

  uniform float uTime;
  uniform float uWindSpeed;
  uniform float uWindStrength;
  uniform vec3  uWindDir;

  attribute vec3  aOffset;
  attribute float aScale;
  attribute float aRotation;
  attribute float aSeed;

  varying vec2  vUv;
  varying float vFogDepth;

  void main() {
    vUv = uv;

    // Scale blade height per-instance
    vec3 pos = position;
    pos.y *= aScale;

    // Rotate blade around Y per-instance
    float c = cos(aRotation), s = sin(aRotation);
    mat3 rotY = mat3(c,0,s,  0,1,0,  -s,0,c);
    pos = rotY * pos;

    // World position
    vec3 world = pos + aOffset;

    // Wind — simplex noise, only bends tip (quadratic by uv.y)
    float windNoise = snoise(aOffset.xz * 0.1 + uTime * uWindSpeed);
    vec3 windBend   = uWindDir * windNoise * uWindStrength * pow(uv.y, 2.0);
    world += windBend;

    vec4 mv = modelViewMatrix * vec4(world, 1.0);
    vFogDepth   = -mv.z;
    gl_Position = projectionMatrix * mv;
  }
`;

const GRASS_FRAG = /* glsl */`
  uniform sampler2D uMap;
  uniform vec3  uBaseColor;
  uniform vec3  uTipColor;
  uniform vec3  uSunDir;
  uniform vec3  uFogColor;
  uniform float uFogDensity;
  uniform float uAlphaTest;

  varying vec2  vUv;
  varying float vFogDepth;

  void main() {
    vec4 texColor = texture2D(uMap, vUv);
    if (texColor.a < uAlphaTest) discard;

    // Root → tip gradient
    vec3 rootColor = vec3(0.01, 0.08, 0.01);
    vec3 baseMix   = mix(rootColor, uBaseColor, smoothstep(0.0, 0.25, vUv.y));
    vec3 color     = mix(baseMix,  uTipColor,  smoothstep(0.2, 0.9,  vUv.y));

    // Simple fake AO: darken roots
    float ao = smoothstep(0.0, 0.35, vUv.y);
    color *= mix(0.3, 1.0, ao);

    // Fog
    float ff = clamp(1.0 - exp(-uFogDensity * vFogDepth), 0.0, 1.0);
    color = mix(color, uFogColor, ff);

    gl_FragColor = vec4(color, 1.0);
  }
`;

/* ── Rock system (ported from Erkaman/gl-rock, MIT) ──────────────────────
   Algorithm:
   1. Start from a SphereGeometry (stacks×slices)
   2. Build vertex adjacency from index buffer
   3. Randomly "scrape" flat faces via flood-fill plane projection
   4. Apply Perlin noise displacement
   5. ShaderMaterial: FBM + ridge noise for crack/colour texture
──────────────────────────────────────────────────────────────────────── */

/* — 3D value noise (for CPU-side mesh displacement) — */
function hash3(x, y, z) {
  let n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
  return n - Math.floor(n);
}
function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
function lerp(a, b, t) { return a + t * (b - a); }
function perlin3(x, y, z) {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  const fx = x - ix,       fy = y - iy,       fz = z - iz;
  const ux = fade(fx), uy = fade(fy), uz = fade(fz);
  const v000 = hash3(ix,   iy,   iz  )*2-1, v100 = hash3(ix+1, iy,   iz  )*2-1;
  const v010 = hash3(ix,   iy+1, iz  )*2-1, v110 = hash3(ix+1, iy+1, iz  )*2-1;
  const v001 = hash3(ix,   iy,   iz+1)*2-1, v101 = hash3(ix+1, iy,   iz+1)*2-1;
  const v011 = hash3(ix,   iy+1, iz+1)*2-1, v111 = hash3(ix+1, iy+1, iz+1)*2-1;
  return lerp(lerp(lerp(v000,v100,ux), lerp(v010,v110,ux), uy),
              lerp(lerp(v001,v101,ux), lerp(v011,v111,ux), uy), uz);
}

/* — Build vertex adjacency from indexed buffer geometry — */
function buildAdjacency(positions, indices) {
  const adj = Array.from({ length: positions.length / 3 }, () => new Set());
  for (let i = 0; i < indices.length; i += 3) {
    const a = indices[i], b = indices[i+1], c = indices[i+2];
    adj[a].add(b); adj[a].add(c);
    adj[b].add(a); adj[b].add(c);
    adj[c].add(a); adj[c].add(b);
  }
  return adj.map(s => Array.from(s));
}

/* — Scrape: flood-fill plane projection (creates flat rock facets) — */
function scrapeRock(posArr, normArr, adjList, strength, radius) {
  const N = posArr.length / 3;
  const start = Math.floor(Math.random() * N);
  // plane normal = normal at start vertex
  const nx = normArr[start*3], ny = normArr[start*3+1], nz = normArr[start*3+2];
  // r0 = start pos shifted inward by strength
  const r0x = posArr[start*3]   + nx * (-strength);
  const r0y = posArr[start*3+1] + ny * (-strength);
  const r0z = posArr[start*3+2] + nz * (-strength);
  const r2 = radius * radius;
  const visited = new Uint8Array(N);
  const stack = [start];
  while (stack.length) {
    const idx = stack.pop();
    if (visited[idx]) continue;
    visited[idx] = 1;
    const px = posArr[idx*3], py = posArr[idx*3+1], pz = posArr[idx*3+2];
    // project onto plane: t = dot(n, r0-p)/dot(n,n)
    const t = nx*(r0x-px) + ny*(r0y-py) + nz*(r0z-pz); // dot(n,n)=1 since normals are unit
    const qx = px + nx*t, qy = py + ny*t, qz = pz + nz*t;
    const dx = qx-r0x, dy = qy-r0y, dz = qz-r0z;
    if (dx*dx + dy*dy + dz*dz < r2) {
      posArr[idx*3] = qx; posArr[idx*3+1] = qy; posArr[idx*3+2] = qz;
      normArr[idx*3] = nx; normArr[idx*3+1] = ny; normArr[idx*3+2] = nz;
      for (const nb of adjList[idx]) if (!visited[nb]) stack.push(nb);
    }
  }
}

/* — Full rock geometry generator — */
function createRockGeometry(seed) {
  const rng = (() => {
    let s = seed * 9301 + 49297;
    return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  })();

  // Build sphere as flat arrays
  const STACKS = 18, SLICES = 18;
  const posArr  = [];
  const normArr = [];
  const uvArr   = [];
  const idxArr  = [];

  for (let st = 0; st <= STACKS; st++) {
    const phi = (st / STACKS) * Math.PI;
    for (let sl = 0; sl <= SLICES; sl++) {
      const theta = (sl / SLICES) * Math.PI * 2;
      const x = Math.sin(phi) * Math.cos(theta);
      const y = Math.cos(phi);
      const z = Math.sin(phi) * Math.sin(theta);
      posArr.push(x, y, z);
      normArr.push(x, y, z);
      uvArr.push(sl/SLICES, st/STACKS);
    }
  }
  for (let st = 0; st < STACKS; st++) {
    for (let sl = 0; sl < SLICES; sl++) {
      const a = st*(SLICES+1)+sl, b = a+1, c = a+(SLICES+1), d = c+1;
      idxArr.push(a, b, c,  b, d, c);
    }
  }

  // Build adjacency
  const adjList = buildAdjacency(posArr, idxArr);

  // Normalise normals (already unit on sphere, but keep for after scraping)
  // Apply scraping: 5-10 times
  const scrapeCount    = 5 + Math.floor(rng() * 6);
  const scrapeStrength = 0.15 + rng() * 0.25;
  const scrapeRadius   = 0.25 + rng() * 0.25;
  for (let s = 0; s < scrapeCount; s++) scrapeRock(posArr, normArr, adjList, scrapeStrength, scrapeRadius);

  // Apply Perlin noise displacement
  const noiseScale    = 1.5 + rng() * 2.5;
  const noiseStrength = 0.08 + rng() * 0.14;
  for (let i = 0, n = posArr.length/3; i < n; i++) {
    const noise = perlin3(
      noiseScale * posArr[i*3],
      noiseScale * posArr[i*3+1],
      noiseScale * posArr[i*3+2]
    ) * noiseStrength;
    posArr[i*3]   += noise;
    posArr[i*3+1] += noise;
    posArr[i*3+2] += noise;
  }

  // Non-uniform scale for squashed/elongated look
  const sx = 0.9 + rng() * 0.4, sy = 0.55 + rng() * 0.35, sz = 0.85 + rng() * 0.4;
  for (let i = 0, n = posArr.length/3; i < n; i++) {
    posArr[i*3] *= sx; posArr[i*3+1] *= sy; posArr[i*3+2] *= sz;
  }

  // Recompute normals from faces
  const reNorm = new Float32Array(posArr.length);
  for (let i = 0; i < idxArr.length; i += 3) {
    const ai = idxArr[i]*3, bi = idxArr[i+1]*3, ci = idxArr[i+2]*3;
    const ax = posArr[ai], ay = posArr[ai+1], az = posArr[ai+2];
    const bx = posArr[bi], by = posArr[bi+1], bz = posArr[bi+2];
    const cx = posArr[ci], cy = posArr[ci+1], cz = posArr[ci+2];
    const ex = bx-ax, ey = by-ay, ez = bz-az;
    const fx = cx-ax, fy = cy-ay, fz = cz-az;
    const nx2 = ey*fz-ez*fy, ny2 = ez*fx-ex*fz, nz2 = ex*fy-ey*fx;
    for (const vi of [ai, bi, ci]) { reNorm[vi]+=nx2; reNorm[vi+1]+=ny2; reNorm[vi+2]+=nz2; }
  }
  for (let i = 0; i < reNorm.length; i += 3) {
    const l = Math.sqrt(reNorm[i]*reNorm[i]+reNorm[i+1]*reNorm[i+1]+reNorm[i+2]*reNorm[i+2]) || 1;
    reNorm[i]/=l; reNorm[i+1]/=l; reNorm[i+2]/=l;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(posArr), 3));
  geo.setAttribute('normal',   new THREE.BufferAttribute(reNorm, 3));
  geo.setAttribute('uv',       new THREE.BufferAttribute(new Float32Array(uvArr), 2));
  geo.setIndex(idxArr);
  return geo;
}

/* — GLSL 3D simplex noise — */
const SNOISE3_GLSL = /* glsl */`
vec4 _s3_permute(vec4 x){return mod(((x*34.0)+1.0)*x,289.0);}
vec4 _s3_taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise3(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);
  const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod(i,289.0);
  vec4 p=_s3_permute(_s3_permute(_s3_permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;
  vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=_s3_taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
  m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
`;

/* — Rock ShaderMaterial (FBM + ridge noise for crack texture) — */
const ROCK_VERT = /* glsl */`
  varying vec3 vNormal;
  varying vec3 vPosition;
  varying float vFogDepth;
  void main() {
    vNormal   = normalMatrix * normal;
    vPosition = position;
    vec4 mv   = modelViewMatrix * vec4(position, 1.0);
    vFogDepth = -mv.z;
    gl_Position = projectionMatrix * mv;
  }
`;

const ROCK_FRAG = /* glsl */`
  ${SNOISE3_GLSL}

  uniform vec3  uAColor;
  uniform vec3  uBColor;
  uniform vec3  uCColor;
  uniform vec3  uLightDir;
  uniform vec3  uFogColor;
  uniform float uFogDensity;

  varying vec3  vNormal;
  varying vec3  vPosition;
  varying float vFogDepth;

  float noise3(vec3 s) { return snoise3(s) * 0.5 + 0.5; }

  float fbm(vec3 p, int n, float persistence) {
    float v = 0.0, total = 0.0, amp = 1.0;
    for (int i = 0; i < 10; i++) {
      if (i >= n) break;
      v += amp * noise3(p); total += amp; amp *= persistence; p *= 2.0;
    }
    return v / total;
  }

  float ridge(vec3 p, int n, float persistence) {
    float v = 0.0, total = 0.0, amp = 1.0;
    for (int i = 0; i < 10; i++) {
      if (i >= n) break;
      float sig = 1.0 - abs(snoise3(p));
      sig = pow(sig, 8.0);
      v += amp * sig; total += amp; amp *= persistence; p *= 2.0;
    }
    return v / total;
  }

  vec3 samplePalette(float t) {
    if (t < 0.25) return vec3(0.0);
    else if (t < 0.5) return mix(uAColor, uBColor, (t - 0.25) / 0.25);
    else return mix(uBColor, uCColor, (t - 0.5) / 0.5);
  }

  void main() {
    vec3 s    = vPosition;
    float t   = fbm(vec3(10.0) * s, 8, 0.8);
    vec3 diff = samplePalette(t);
    float t1  = ridge(s, 8, 0.8);
    float t2  = ridge(s + vec3(4343.3), 8, 0.8);
    diff += 0.22 * t1 - 0.22 * t2;

    // Lighting
    vec3 n    = normalize(vNormal);
    vec3 l    = normalize(uLightDir);
    float dif = max(dot(n, l), 0.0);
    vec3 color = diff * (vec3(0.5) + vec3(0.4) * dif);

    // Fog
    float ff  = clamp(1.0 - exp(-uFogDensity * vFogDepth), 0.0, 1.0);
    color = mix(color, uFogColor, ff);

    gl_FragColor = vec4(color, 1.0);
  }
`;

/* — Rock pool — */
const ROCKS_PER_TREE = 3;
const rockPool = [];

// Precompute 8 prototype geometries
const ROCK_GEOS = Array.from({ length: 8 }, (_, i) => createRockGeometry(i * 37 + 13));

const ROCK_MAT = new THREE.ShaderMaterial({
  vertexShader  : ROCK_VERT,
  fragmentShader: ROCK_FRAG,
  uniforms: {
    uAColor    : { value: new THREE.Color(0.50, 0.42, 0.32) },
    uBColor    : { value: new THREE.Color(0.60, 0.53, 0.43) },
    uCColor    : { value: new THREE.Color(0.70, 0.66, 0.58) },
    uLightDir  : { value: new THREE.Vector3(30, 60, -20).normalize() },
    uFogColor  : { value: FOG_COLOR },
    uFogDensity: { value: FOG_DENSITY },
  },
});

function buildRockSystem(treePool) {
  for (let t = 0; t < treePool.length; t++) {
    const tree = treePool[t];
    for (let r = 0; r < ROCKS_PER_TREE; r++) {
      const angle  = Math.random() * Math.PI * 2;
      const radius = grassCfg.spread * (0.3 + Math.random() * 1.1);
      const lx = Math.cos(angle) * radius;
      const lz = Math.sin(angle) * radius;
      const size = 0.07 + Math.random() * 0.18;

      const geo  = ROCK_GEOS[Math.floor(Math.random() * ROCK_GEOS.length)];
      const mesh = new THREE.Mesh(geo, ROCK_MAT);
      mesh.position.set(tree.position.x + lx, size * 0.48, tree.position.z + lz);
      mesh.rotation.set(Math.random() * 0.5, Math.random() * Math.PI * 2, Math.random() * 0.5);
      mesh.scale.setScalar(size);
      mesh.castShadow = mesh.receiveShadow = true;
      scene.add(mesh);
      rockPool.push({ mesh, treeIdx: t, localX: lx, localZ: lz });
    }
  }
}

/* ─────────────────────────────────────────────────────────────────────────
   Build the InstancedBufferGeometry for all grass blades.
   Called once after tree pool is placed; also called again after each
   tree wrap to update aOffset.
   We track: grassInstGeo, grassOffsets (Float32Array), grassTreeIdx, grassLocalOff
───────────────────────────────────────────────────────────────────────── */
let grassMesh    = null;
let grassInstGeo = null;
let grassOffsets = null;   // live world positions fed to aOffset
let grassTreeIdx = null;   // which tree owns blade[i]
let grassLocalX  = null;   // local XZ around tree base
let grassLocalZ  = null;

function buildGrassSystem(treePool) {
  if (!grassCfg.enabled || !treePool.length) return;

  const BLADES = treePool.length * grassCfg.count;

  grassOffsets = new Float32Array(BLADES * 3);
  grassTreeIdx = new Int32Array(BLADES);
  grassLocalX  = new Float32Array(BLADES);
  grassLocalZ  = new Float32Array(BLADES);

  const scales    = new Float32Array(BLADES);
  const rotations = new Float32Array(BLADES);
  const seeds     = new Float32Array(BLADES);

  for (let t = 0; t < treePool.length; t++) {
    const tree = treePool[t];
    for (let g = 0; g < grassCfg.count; g++) {
      const i = t * grassCfg.count + g;
      const angle = Math.random() * Math.PI * 2;
      const r     = grassCfg.spread * Math.sqrt(Math.random());
      const lx    = Math.cos(angle) * r;
      const lz    = Math.sin(angle) * r;
      grassLocalX[i] = lx;
      grassLocalZ[i] = lz;
      grassTreeIdx[i] = t;
      grassOffsets[i*3]   = tree.position.x + lx;
      grassOffsets[i*3+1] = 0.0;
      grassOffsets[i*3+2] = tree.position.z + lz;
      scales[i]    = 0.6 + Math.random() * 0.8;
      rotations[i] = Math.random() * Math.PI * 2;
      seeds[i]     = Math.random();
    }
  }

  const bladeGeo = createBladeGeometry(grassCfg.width, grassCfg.height);
  grassInstGeo = new THREE.InstancedBufferGeometry();
  grassInstGeo.index                = bladeGeo.index;
  grassInstGeo.attributes.position  = bladeGeo.attributes.position;
  grassInstGeo.attributes.uv        = bladeGeo.attributes.uv;
  grassInstGeo.attributes.normal    = bladeGeo.attributes.normal;
  grassInstGeo.setAttribute('aOffset',   new THREE.InstancedBufferAttribute(grassOffsets, 3, false));
  grassInstGeo.setAttribute('aScale',    new THREE.InstancedBufferAttribute(scales,       1, false));
  grassInstGeo.setAttribute('aRotation', new THREE.InstancedBufferAttribute(rotations,    1, false));
  grassInstGeo.setAttribute('aSeed',     new THREE.InstancedBufferAttribute(seeds,        1, false));
  grassInstGeo.instanceCount = BLADES;

  const bladeTex = makeBladeTexture();
  renderer.initTexture(bladeTex);

  const grassMat = new THREE.ShaderMaterial({
    vertexShader  : GRASS_VERT,
    fragmentShader: GRASS_FRAG,
    uniforms: {
      uTime       : { value: 0 },
      uWindSpeed  : { value: grassCfg.windSpeed },
      uWindStrength: { value: grassCfg.wind },
      uWindDir    : { value: new THREE.Vector3(1, 0, 0.5).normalize() },
      uMap        : { value: bladeTex },
      uBaseColor  : { value: new THREE.Color(grassCfg.baseColor) },
      uTipColor   : { value: new THREE.Color(grassCfg.tipColor) },
      uSunDir     : { value: new THREE.Vector3(30, 60, -20).normalize() },
      uFogColor   : { value: FOG_COLOR },
      uFogDensity : { value: FOG_DENSITY },
      uAlphaTest  : { value: 0.35 },
    },
    side        : THREE.DoubleSide,
    transparent : false,
    alphaTest   : 0.35,
  });

  grassMesh = new THREE.Mesh(grassInstGeo, grassMat);
  grassMesh.frustumCulled = false;
  grassMesh.renderOrder   = 0;
  scene.add(grassMesh);
}

/* ── Main ────────────────────────────────── */
async function main() {
  const [gltfs] = await Promise.all([
    Promise.all(['tree_default.glb','tree_oak.glb','tree_cone.glb'].map(f => loadGLB(TREE_MODELS_BASE + f))),
    Promise.all(pendingTextures),
  ]);

  const prototypes = gltfs.map(g => {
    const root = g.scene;
    root.traverse(n => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
    const box = new THREE.Box3().setFromObject(root);
    root.scale.setScalar(4.0 / (box.max.y - box.min.y));
    box.setFromObject(root);
    root.position.y -= box.min.y;
    return root;
  });

  /* ── Tree pool ───────────────────────────── */
  const TREE_SPACING = 5, TREE_ROWS = 60;
  const HALF_Z = (TREE_ROWS * TREE_SPACING) / 2;
  const CYCLE  = TREE_ROWS * TREE_SPACING;
  const treePool = [];

  const COLUMNS = [
    { xMin: 2.2,  xMax: 5.5,  scale: 1.0  },
    { xMin: 5.5,  xMax: 10.0, scale: 1.15 },
    { xMin: 10.0, xMax: 17.0, scale: 1.3  },
    { xMin: 17.0, xMax: 27.0, scale: 1.5  },
    { xMin: 27.0, xMax: 40.0, scale: 1.7  },
  ];

  for (let i = 0; i < TREE_ROWS; i++) {
    const z = -HALF_Z + i * TREE_SPACING;
    for (const col of COLUMNS) {
      const jitter = (Math.random() - 0.5) * 3;
      const x = col.xMin + Math.random() * (col.xMax - col.xMin);
      for (const sx of [x, -x]) {
        const proto = prototypes[Math.floor(Math.random() * prototypes.length)];
        const inst  = proto.clone();
        inst.position.set(sx, 0, z + jitter);
        inst.rotation.y = Math.random() * Math.PI * 2;
        inst.scale.multiplyScalar((0.85 + Math.random() * 0.4) * col.scale);
        scene.add(inst);
        treePool.push(inst);
      }
    }
  }

  /* ── Build grass ─────────────────────────── */
  buildGrassSystem(treePool);

  /* ── Build rocks ─────────────────────────── */
  buildRockSystem(treePool);

  /* ── GPU warm-up ─────────────────────────── */
  for (const tex of [groundColorTex, groundRoughTex, groundNormalTex, pathTex]) {
    renderer.initTexture(tex);
  }
  const _wRM = new THREE.MeshPhysicalMaterial({
    color: 0xcc0022, emissive: 0x440008, roughness: 0.05, metalness: 0.0,
    transmission: 0.5, thickness: 0.5, clearcoat: 1.0, clearcoatRoughness: 0.05,
  });
  const _wR = new THREE.Mesh(new THREE.OctahedronGeometry(0.28, 0), _wRM);
  _wR.position.set(0, -1000, 0); scene.add(_wR);
  const _wPG = new THREE.BufferGeometry();
  _wPG.setAttribute('position', new THREE.BufferAttribute(new Float32Array(3), 3));
  _wPG.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(3), 3));
  const _wPM = new THREE.PointsMaterial({ size: 0.18, transparent: true, vertexColors: true });
  const _wP  = new THREE.Points(_wPG, _wPM);
  _wP.position.set(0, -1000, 0); scene.add(_wP);
  renderer.compile(scene, camera);
  scene.remove(_wR);  _wRM.dispose();
  scene.remove(_wP);  _wPG.dispose(); _wPM.dispose();

  /* ── Hide loading screen ─────────────────── */
  const loadDiv = document.getElementById('loading');
  loadDiv.style.opacity = '0';
  setTimeout(() => loadDiv.remove(), 700);

  /* ── Ruby gems ───────────────────────────── */
  const rubyMat = new THREE.MeshPhysicalMaterial({
    color: 0xcc0022, emissive: 0x440008, roughness: 0.05, metalness: 0.0,
    transmission: 0.5, thickness: 0.5, reflectivity: 1.0,
    clearcoat: 1.0, clearcoatRoughness: 0.05,
  });
  const rubyGeo = new THREE.OctahedronGeometry(0.28, 0);
  const rubies  = [];

  function spawnRuby(side) {
    const gem = new THREE.Mesh(rubyGeo, rubyMat);
    gem.position.set(side * (1.8 + Math.random() * 0.4), 0.3, camZ - 18);
    gem.rotation.set(Math.random(), Math.random(), Math.random());
    scene.add(gem);
    rubies.push({ mesh: gem, alive: true });
  }

  /* ── Particle splashes ───────────────────── */
  const RUBY_PALETTE = [
    [1.0,.05,.15],[1.0,.2,.3],[.9,0,.05],
    [1.0,.55,.1],[1.0,.85,.2],[1,1,1],[.7,0,.2],[1,.3,.5],
  ];
  const activeSplashes = [];
  const PARTICLE_COUNT = 300, P_DURATION = 2.0;

  function doSplash(ruby) {
    if (!ruby.alive) return;
    const origin = ruby.mesh.position.clone();
    scene.remove(ruby.mesh); ruby.alive = false;
    const pPos = new Float32Array(PARTICLE_COUNT*3);
    const pCol = new Float32Array(PARTICLE_COUNT*3);
    const pVel = Array.from({length: PARTICLE_COUNT}, () => new THREE.Vector3());
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      pPos[i*3] = origin.x; pPos[i*3+1] = origin.y; pPos[i*3+2] = origin.z;
      const speed = Math.random()<.3 ? 10+Math.random()*8 : 3+Math.random()*6;
      const theta = Math.random()*Math.PI*2, phi = Math.random()*Math.PI;
      pVel[i].set(Math.sin(phi)*Math.cos(theta)*speed, Math.abs(Math.cos(phi))*speed*1.2+Math.random()*3, Math.sin(phi)*Math.sin(theta)*speed);
      const col = RUBY_PALETTE[Math.floor(Math.random()*RUBY_PALETTE.length)];
      pCol[i*3]=col[0]; pCol[i*3+1]=col[1]; pCol[i*3+2]=col[2];
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pPos,3));
    geo.setAttribute('color',    new THREE.BufferAttribute(pCol,3));
    const mat = new THREE.PointsMaterial({ size:.18, sizeAttenuation:true, transparent:true, opacity:1.0, depthWrite:false, vertexColors:true });
    const pts = new THREE.Points(geo, mat);
    scene.add(pts);
    activeSplashes.push({ points:pts, mat, geo, pPos, pVel, life:P_DURATION });
  }

  /* ── Animation loop ──────────────────────── */
  const SPEED = 5;
  const clock  = new THREE.Clock();
  let camZ = 0, elapsed = 0, nextIdx = 0;

  function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    elapsed += dt;

    camZ -= SPEED * dt;
    camera.position.z = camZ;

    // Ruby spawns
    while (nextIdx < schedule.length && elapsed >= schedule[nextIdx].time) {
      spawnRuby(schedule[nextIdx].side); nextIdx++;
    }

    // Rubies
    for (const r of rubies) {
      if (!r.alive) continue;
      r.mesh.rotation.y += dt * 1.8;
      r.mesh.rotation.x += dt * 0.6;
      r.mesh.position.y  = 0.3 + Math.sin(Date.now()*.002 + r.mesh.position.x) * 0.12;
      if (r.mesh.position.z >= camZ - 2.5) doSplash(r);
    }

    // Splashes
    for (let s = activeSplashes.length-1; s >= 0; s--) {
      const sp = activeSplashes[s]; sp.life -= dt;
      const t = 1 - sp.life / P_DURATION;
      sp.mat.opacity = Math.max(0, 1 - t*t*1.5);
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        sp.pPos[i*3]   += sp.pVel[i].x * dt;
        sp.pPos[i*3+1] += (sp.pVel[i].y - 9.8*t*1.2) * dt;
        sp.pPos[i*3+2] += sp.pVel[i].z * dt;
      }
      sp.geo.attributes.position.needsUpdate = true;
      if (sp.life <= 0) { scene.remove(sp.points); sp.geo.dispose(); sp.mat.dispose(); activeSplashes.splice(s,1); }
    }

    // Wrap tree pool + sync grass positions
    for (let ti = 0; ti < treePool.length; ti++) {
      const tree = treePool[ti];
      const rel  = tree.position.z - camZ;
      if (rel > CYCLE/2)  tree.position.z -= CYCLE;
      if (rel < -CYCLE/2) tree.position.z += CYCLE;
    }

    // Sync rocks with their parent trees after wrapping
    for (const rock of rockPool) {
      const tree = treePool[rock.treeIdx];
      rock.mesh.position.x = tree.position.x + rock.localX;
      rock.mesh.position.z = tree.position.z + rock.localZ;
    }

    // Update grass blade world positions after tree wrapping
    if (grassCfg.enabled && grassInstGeo) {
      for (let i = 0; i < grassInstGeo.instanceCount; i++) {
        const tree = treePool[grassTreeIdx[i]];
        grassOffsets[i*3]   = tree.position.x + grassLocalX[i];
        grassOffsets[i*3+1] = 0.0;
        grassOffsets[i*3+2] = tree.position.z + grassLocalZ[i];
      }
      grassInstGeo.attributes.aOffset.needsUpdate = true;

      // Animate wind time uniform
      grassMesh.material.uniforms.uTime.value = elapsed;
    }

    // Clouds
    for (const cloud of clouds) {
      cloud.position.x += 0.5 * dt;
      if (cloud.position.x > 60) cloud.position.x = -60;
      const relZ = cloud.position.z - camZ;
      if (relZ > 1000)  cloud.position.z -= 2000;
      if (relZ < -1000) cloud.position.z += 2000;
    }

    renderer.render(scene, camera);
  }

  animate();
}

main().catch(console.error);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
  </script>
</body>
